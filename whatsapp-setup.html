<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WhatsApp Setup - TRAINNING by ML</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }

    .contenedor {
      max-width: 650px;
      margin: 60px auto;
      padding: 35px;
      border: 1px solid #dddddd;
      border-radius: 12px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      line-height: 1.5;
    }

    button {
      margin-top: 25px;
      padding: 15px 28px;
      font-size: 17px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #25D366;
      color: #ffffff;
    }

    #estado {
      margin-top: 25px;
      font-size: 14px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>Configuración de WhatsApp</h1>

    <p>
      Página temporal de configuración para TRAINNING by ML.
    </p>

    <p>
      Utiliza el botón únicamente para iniciar el registro
      insertado de WhatsApp.
    </p>

    <button onclick="launchWhatsAppSignup()">
      Conectar WhatsApp Business
    </button>

    <div id="estado"></div>

  </div>


  <script>

    window.fbAsyncInit = function () {

      FB.init({
        appId: '2152730142317094',
        cookie: true,
        xfbml: true,
        version: 'v25.0'
      });

    };


    (function (d, s, id) {

      var js;
      var fjs = d.getElementsByTagName(s)[0];

      if (d.getElementById(id)) {
        return;
      }

      js = d.createElement(s);
      js.id = id;
      js.src = "https://connect.facebook.net/es_LA/sdk.js";

      fjs.parentNode.insertBefore(js, fjs);

    }(document, 'script', 'facebook-jssdk'));


    function launchWhatsAppSignup() {

      document.getElementById('estado').innerText =
        'Abriendo configuración de WhatsApp...';

      FB.login(

        function (response) {

          console.log('Respuesta de Meta:', response);

          if (response.authResponse) {

            document.getElementById('estado').innerText =
              'Meta respondió correctamente. No cierres esta página todavía.';

          } else {

            document.getElementById('estado').innerText =
              'El proceso fue cancelado o no pudo completarse.';

          }

        },

        {
          config_id: '1079230401492656',
          response_type: 'code',
          override_default_response_type: true,

          extras: {
            sessionInfoVersion: '3'
          }
        }

      );

    }


    window.addEventListener('message', function (event) {

      if (
        event.origin !== 'https://www.facebook.com' &&
        event.origin !== 'https://web.facebook.com'
      ) {
        return;
      }

      try {

        const data = JSON.parse(event.data);

        if (data.type === 'WA_EMBEDDED_SIGNUP') {

          console.log('WhatsApp Embedded Signup:', data);

          if (data.event === 'FINISH') {

            document.getElementById('estado').innerText =
              'Registro de WhatsApp finalizado correctamente.';

          } else if (data.event === 'CANCEL') {

            document.getElementById('estado').innerText =
              'El registro de WhatsApp fue cancelado.';

          } else if (data.event === 'ERROR') {

            document.getElementById('estado').innerText =
              'Meta reportó un error durante el registro de WhatsApp.';

          }

        }

      } catch (error) {

        console.log('Mensaje recibido:', event.data);

      }

    });

  </script>

</body>
</html>
